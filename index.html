async function cek(){const n=$('#cn').value.trim(),o=$('#cr');const w=JSON.parse(ls.g('pk_cek','[]')).filter(t=>Date.now()-t<60e3);if(w.length>=5){o.innerHTML='<div class="msg bad">Terlalu sering memeriksa. Tunggu sebentar lalu coba lagi.</div>';return}ls.s('pk_cek',JSON.stringify([...w,Date.now()]));if(!/^\d{16}$/.test(n)){o.innerHTML='<div class="msg bad">Masukkan 16 digit NIK.</div>';return}
try{const q=await DB.collection('cek').doc(n).get(),p=q.exists?q.data():null;o.innerHTML=p?`<div class="msg ok"><b>${esc(p.nama)}</b><br>Desil: <b>${esc(p.desil)}</b><br>Bantuan: <b>${esc(p.bansos)}</b>${p.ket?'<br>Keterangan: '+esc(p.ket):''}</div>`:'<div class="msg warn"><b>Data belum tersedia</b><br>Data bantuan Anda mungkin belum diisi petugas. Silakan hubungi Kantor Desa Cikulak Kidul.</div>'}catch(e){o.innerHTML='<div class="msg bad"><b>Gagal memeriksa</b><br>Periksa koneksi internet Anda, lalu coba lagi.</div>'}}
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const kodeAdu=()=>'P'+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>AL[b%AL.length]).join('');
const hpNorm=h=>{let d=String(h||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d};
const hashAdu=(kode,hp)=>sha(String(kode).toUpperCase()+'|'+hpNorm(hp));
async function adu(){const n=$('#pn').value.trim(),i=$('#pi').value.trim(),hp=$('#ph').value.trim(),kat=$('#pk')?.value||'Lainnya';
if(!n||!i)return toast('Isi nama dan pengaduan');if(hpNorm(hp).length<10)return toast('Isi nomor HP yang aktif untuk cek balasan');if(!$('#pset')?.checked)return toast('Centang persetujuan data pribadi');
const kode=kodeAdu(),tgl=today(),tenggat=new Date(Date.now()+7*864e5).toLocaleDateString('sv');let h;try{h=await hashAdu(kode,hp)}catch(e){return toast('Browser ini tidak mendukung pengamanan data. Buka lewat alamat https.')}
if(DB){try{await DB.collection('adu_cek').doc(kode).set({status:'baru',tgl,isi:i,balasan:'',hpHash:h})}catch(e){return toast('Pengaduan belum terkirim. Periksa koneksi lalu coba lagi.')}}
save('pengaduan',{id:uid(),kode,nama:n,hp,isi:i,kategori:kat,tgl,tenggat,pic:'',status:'baru',balasan:'',hpHash:h,persetujuan:true});

async function cekAdu(){const k=$('#ak2').value.trim().toUpperCase(),h=$('#ah2').value.trim(),o=$('#ar');if(!k||hpNorm(h).length<10)return o.innerHTML='<div class="msg bad">Isi kode pengaduan dan nomor HP yang didaftarkan.</div>';

function pjChg(v){const h=D.hadir.find(x=>x.id==lastH);if(!h)return;D.hadir.filter(x=>x.nik==h.nik&&x.periode==h.periode).forEach(x=>save('hadir',{...x,jenis:v}));$('#pg').innerHTML=pgHtml()}
function simpanPg(){const h=D.hadir.find(x=>x.id==lastH);if(!h)return;const grp=D.hadir.filter(x=>x.nik==h.nik&&x.periode==h.periode),j=h.jenis||'sendiri',v=i=>($('#'+i)?.value||'').trim();
if(j=='sendiri'){grp.forEach(x=>save('hadir',{...x,jenis:'sendiri',pengambil:'',nikPengambil:'',ketAmbil:''}))}
else{const n=v('pn2'),k=v('pk2');if(!n)return toast('Isi nama pengambil');if(k&&!/^\d{16}$/.test(k))return toast('NIK pengambil harus 16 digit');
const dup=k?D.hadir.filter(x=>x.nikPengambil==k&&x.periode==h.periode&&x.nik!=h.nik).length:0;if(dup&&!confirm('NIK ini sudah mengambil untuk '+dup+' penerima lain pada periode ini. Tetap simpan?'))return;

async function bacaKtp(inp){const f=inp.files[0],o=$('#ks');if(!f)return;const M=(c,t)=>o.innerHTML=`<div class="msg ${c}">${t}</div>`;
if(!window.Tesseract)return M('bad','Pembaca KTP belum termuat. Isi data secara manual.');M('','Membaca KTP, tunggu beberapa detik…');
try{const b=await kecil(f),r=await Tesseract.recognize(b,'ind'),T=r.data.text.replace(/\r/g,''),fx=x=>x.replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/S/g,'5').replace(/B/g,'8');
let nik='';for(const m of T.matchAll(/[0-9OoIl|SB]{16}/g)){const c=fx(m[0]);if(/^\d{16}$/.test(c)){nik=c;break}}
const nm=((T.match(/Nama\s*[:;]?\s*([A-Za-z' .]{3,})/i)||[])[1]||'').trim().toUpperCase(),ok=nik&&nm;
if(nm&&$('#pn2'))$('#pn2').value=nm;if(nik&&$('#pk2'))$('#pk2').value=nik;
M(ok?'ok':'bad',ok?'Terbaca. Cocokkan dengan KTP asli sebelum menyimpan.':'Sebagian belum terbaca. Lengkapi manual atau foto ulang (cahaya cukup, KTP lurus dan penuh).')}
catch(e){M('bad','Gagal membaca KTP. Isi manual atau coba foto ulang.')}inp.value=''}
const expHadir=()=>{const p=PER();unduh('kehadiran-bansos-'+(p||'periode').replace(/\W+/g,'-')+'.csv',csv(D.hadir.filter(x=>x.periode==p).map(x=>({...x,jn:JN[x.jenis||'sendiri']})),[['periode','Periode'],['nama','Nama di undangan'],['nik','NIK penerima'],['bansos','Bantuan'],['jn','Pengambil'],['pengambil','Nama pengambil'],['nikPengambil','NIK pengambil'],['ketAmbil','Keterangan'],['tgl','Tanggal'],['jam','Jam']]))};

function proses(t){const cp=D.hadir.find(x=>x.id==lastH);if(cp&&cp.jenis&&cp.jenis!='sendiri'&&!cp.pengambil){toast('Isi dan simpan data pengambil '+cp.nama+' dulu');return}const nik=String(t).replace(/^BANSOS:/,'').trim(),p=D.penerima.find(x=>x.nik==nik),per=PER();

else{const sudah=D.hadir.filter(x=>x.nik==nik&&x.periode==per).map(x=>x.bansos),sisa=bsArr(p).filter(b=>!sudah.includes(b));

function cariHtml(q){q=(q||'').trim().toLowerCase();if(q.length<3)return'<p class="empty">Ketik minimal 3 huruf nama atau angka NIK.</p>';
const m=new Map(),hit=x=>String(x.nama||'').toLowerCase().includes(q)||String(x.nik||'').includes(q);
D.penerima.forEach(p=>{if(hit(p))m.set(String(p.nik),p)});D.antrian.forEach(a=>{if(hit(a)&&!m.has(String(a.nik)))m.set(String(a.nik),{nik:a.nik,nama:a.nama,alamat:a.alamat,belum:1})});
const L=[...m.values()].slice(0,20);if(!L.length)return'<p class="empty">Tidak ada warga yang cocok.</p>';
return L.map(p=>{const dl=D.log.filter(x=>x.aksi=='desil'&&x.nik==p.nik),h=D.hadir.filter(x=>x.nik==p.nik),a=D.antrian.filter(x=>x.nik==p.nik).sort((x,y)=>String(y.tgl).localeCompare(x.tgl));
return`<div class="card"><div class="row"><div class="av" style="flex:0 0 36px">${esc((p.nama||'?')[0])}</div><div><b>${esc(p.nama)}</b><br><small>NIK ${esc(p.nik)}${p.dusun?' · '+esc(p.dusun):''}${p.alamat?' · '+esc(p.alamat):''}</small></div></div>${p.belum?'<div class="msg">Belum terdaftar sebagai penerima bansos. Hanya tercatat di antrian BPJS.</div>':`<p style="margin-top:10px"><span class="chip">Desil ${esc(p.desil)}</span> <span class="chip">${esc(p.bansos)}</span> ${p.ket?'<small>'+esc(p.ket)+'</small>':''}</p>`}<h3>Riwayat ambil bansos (${h.length})</h3>${h.map(x=>`<p class="hs">${esc(x.periode||'-')} · ${esc(x.tgl)}${x.pengambil?' · diambil oleh '+esc(x.pengambil):''}</p>`).join('')||'<p class="hs">Belum pernah tercatat.</p>'}<h3 style="margin-top:12px">Perubahan desil (${dl.length})</h3>${dl.slice(0,5).map(x=>`<p class="hs">${esc(x.waktu.slice(0,10))} · ${esc(x.ket)}</p>`).join('')||'<p class="hs">Belum ada perubahan desil.</p>'}<h3 style="margin-top:12px">Riwayat antrian BPJS (${a.length})</h3>${a.slice(0,8).map(x=>`<p class="hs">${esc(x.tgl)} · ${pad(x.nomor)} · ${esc(x.layanan)} · ${esc(x.status)}</p>`).join('')||'<p class="hs">Belum pernah antri.</p>'}</div>`}).join('')}

function rekapData(m){const A=D.antrian.filter(x=>String(x.tgl).startsWith(m)).sort((a,b)=>String(a.tgl).localeCompare(b.tgl)||a.nomor-b.nomor),H=D.hadir.filter(x=>String(x.tgl).startsWith(m)),G=D.pengaduan.filter(x=>String(x.tgl).startsWith(m));
return{A,H,G,bl:cnt(A,x=>x.layanan||'Lainnya'),bj:cnt(H,x=>x.bansos||'Lainnya')}}

function tglData(r){const T={};const g=t=>T[t]||(T[t]={tgl:t,a:0,s:0,h:0,w:0});r.A.forEach(x=>{const o=g(x.tgl);o.a++;if(x.status=='selesai')o.s++});r.H.forEach(x=>{const o=g(x.tgl);o.h++;if(x.jenis&&x.jenis!='sendiri')o.w++});return Object.values(T).sort((p,q)=>String(q.tgl).localeCompare(String(p.tgl)))}
function tglTabel(r){const L=tglData(r);if(!L.length)return'<p class="empty">Belum ada antrian atau kehadiran pada bulan ini.</p>';const t={a:0,s:0,h:0,w:0};L.forEach(o=>{t.a+=o.a;t.s+=o.s;t.h+=o.h;t.w+=o.w});
return`<div class="tw"><table><tr><th>Tanggal</th><th>Antrian BPJS</th><th>Selesai</th><th>Bansos diambil</th><th>Via perwakilan</th></tr>${L.map(o=>`<tr><td>${esc(o.tgl)}</td><td>${o.a}</td><td>${o.s}</td><td>${o.h}</td><td>${o.w}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${t.a}</b></td><td><b>${t.s}</b></td><td><b>${t.h}</b></td><td><b>${t.w}</b></td></tr></table></div>`}
function tRekap(){const r=rekapData(rb),k=[[r.A.length,'Antrian BPJS'],[r.A.filter(x=>x.status=='selesai').length,'Selesai dilayani'],[r.H.length,'Pengambilan bansos'],[r.G.length,'Pengaduan masuk'],[r.G.filter(x=>x.status=='selesai').length,'Pengaduan selesai']];
return`<div class="card lap"><div class="row noprint"><input type="month" value="${rb}" max="${today().slice(0,7)}" onchange="rb=this.value||rb;render(true)" aria-label="Pilih bulan" style="max-width:200px"><button class="btn" onclick="unduhRekap()">Unduh Excel</button><button class="btn alt" onclick="print()">Cetak</button></div><h2 style="margin-top:14px">Rekap bulanan Puskesos Desa Cikulak Kidul</h2><p>Periode: <b>${bln(rb)}</b></p><div class="rk">${k.map(([n,t])=>`<div><b>${n}</b><small>${t}</small></div>`).join('')}</div><div class="grid2"><div><h3>Layanan BPJS per jenis</h3>${bars(r.bl)}</div><div><h3>Bansos diambil per jenis</h3>${bars(r.bj)}</div></div><h3 style="margin-top:20px">Rekap kehadiran per tanggal</h3>${tglTabel(r)}</div>`}
function unduhRekap(){if(!window.XLSX)return toast('Pustaka Excel belum termuat');const r=rekapData(rb),wb=XLSX.utils.book_new(),ad=(n,ws)=>XLSX.utils.book_append_sheet(wb,ws,n);
ad('Ringkasan',XLSX.utils.aoa_to_sheet([['Rekap Puskesos Desa Cikulak Kidul'],['Periode',bln(rb)],['Antrian BPJS',r.A.length],['Selesai dilayani',r.A.filter(x=>x.status=='selesai').length],['Pengambilan bansos',r.H.length],['Pengaduan masuk',r.G.length],['Pengaduan selesai',r.G.filter(x=>x.status=='selesai').length],[],['Layanan BPJS','Jumlah'],...Object.entries(r.bl),[],['Jenis bansos','Jumlah'],...Object.entries(r.bj)]));
ad('Antrian',XLSX.utils.json_to_sheet(r.A.map(x=>({Tanggal:x.tgl,Jam:x.jam,Nomor:pad(x.nomor),Nama:san(x.nama),NIK:String(x.nik),Layanan:san(x.layanan),Status:x.status}))));
ad('Bansos',XLSX.utils.json_to_sheet(r.H.map(x=>({Tanggal:x.tgl,Periode:san(x.periode),Nama:san(x.nama),NIK:String(x.nik),Pengambil:san(x.pengambil)}))));
ad('Per tanggal',XLSX.utils.json_to_sheet(tglData(r).map(o=>({Tanggal:o.tgl,'Antrian BPJS':o.a,Selesai:o.s,'Bansos diambil':o.h,'Via perwakilan':o.w}))));XLSX.writeFile(wb,'Rekap_Puskesos_'+rb+'.xlsx')}

function vTV(p){const z=zm(),c=PS&&PS.tgl==today()?PS:null,nx=authed?D.antrian.filter(x=>x.tgl==today()&&x.status=='menunggu').sort((a,b)=>a.nomor-b.nomor).slice(0,p?4:3):[];
const num=`<div class="tvm"><small>NOMOR DIPANGGIL</small><div class="tvn">${c?pad(c.nomor):'—'}</div><p>${z.on?'Silakan gabung Zoom pelayanan BPJS':'Silakan menuju loket pelayanan BPJS'}</p></div>`;
return`<div class="tv${p?' tvp':''}"><div class="tvh"><div class="logo"><img src="${LOGO}" alt=""></div><div><b>E PUSKESOS</b><small>Desa Cikulak Kidul, Kec. Waled, Kab. Cirebon</small></div><div class="tvc" id="tvc"></div></div>${z.on&&!p?`<div class="tvw">${num}${zoomBox(190)}</div>`:num+(z.on?zoomBox(120):'')}${authed?`<div class="tvx"><small>Berikutnya</small><div>${nx.map(x=>`<span>${pad(x.nomor)}</span>`).join('')||'<em>Belum ada antrian menunggu</em>'}</div></div>`:''}<div class="tvf">${PS&&PS.info?esc(PS.info):'Jadwal pelayanan: '+esc(jdw())}</div><div class="tvb noprint">${p?'<a href="#tv">Tampilan penuh</a>':`<a href="#beranda">Keluar</a><button onclick="bukaPanelTV()">Panel samping (untuk di sebelah Zoom)</button><button onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">Layar penuh</button>`}</div></div>`}
function bukaPanelTV(){const w=Math.min(460,Math.round(screen.availWidth/3)),h=screen.availHeight;const win=window.open(location.href.split('#')[0]+'#tvp','pk_tvp','popup=yes,width='+w+',height='+h+',left='+((screen.availLeft||0)+screen.availWidth-w)+',top=0');if(!win)toast('Popup diblokir browser. Izinkan popup, atau buka alamat dengan #tvp di jendela baru.')}
async function simpanZoom(){const u=$('#zu').value.trim();if(u&&!/^https:\/\/([a-z0-9-]+\.)*(zoom\.us|zoom\.com|zoomgov\.com)\//i.test(u))return toast('Tautan harus berupa alamat Zoom (https://...zoom.us/...)');
const o={zoomOn:$('#zo').value=='1'&&!!u,zoomUrl:u,zoomId:$('#zi').value.trim().slice(0,30),zoomPw:$('#zp').value.trim().slice(0,30),waMode:+$('#wa').value,waAuto:+$('#wa').value==2,waTpl:$('#wt').value.trim().slice(0,600)};
try{await DB.collection('publik').doc('status').set(o,{merge:true});catat('ubah pengaturan','Zoom layanan BPJS '+(o.zoomOn?'aktif':'nonaktif'),'');toast(o.zoomOn?'Zoom layanan BPJS aktif dan tampil di layar TV serta halaman warga':'Pengaturan Zoom disimpan (nonaktif)')}catch(e){toast('Gagal menyimpan pengaturan Zoom')}}
const zoomSetCard=()=>{const z=PS||{},wm=waMode();return`<div class="card"><h2>Zoom layanan BPJS</h2><p class="hs">Dipakai bila layanan BPJS dilakukan lewat Zoom. Tautan, Meeting ID, dan kode sandi akan tampil di layar TV dan di halaman warga. Zoom tidak bisa ditanam di dalam aplikasi, jadi buka Zoom di satu jendela dan Panel samping di jendela lain.</p><label for="zo" style="margin-top:0">Status</label><select id="zo"><option value="1" ${z.zoomOn?'selected':''}>Aktif</option><option value="0" ${z.zoomOn?'':'selected'}>Nonaktif</option></select><label for="zu">Tautan rapat Zoom</label><input id="zu" inputmode="url" placeholder="https://zoom.us/j/1234567890?pwd=..." value="${esc(z.zoomUrl||'')}"><div class="row"><div><label for="zi">Meeting ID</label><input id="zi" value="${esc(z.zoomId||'')}"></div><div><label for="zp">Kode sandi</label><input id="zp" value="${esc(z.zoomPw||'')}"></div></div><label for="wa">Pengiriman WhatsApp saat nomor dipanggil</label><select id="wa"><option value="0" ${wm==0?'selected':''}>Manual: hanya lewat tombol WA di daftar antrian</option><option value="1" ${wm==1?'selected':''}>Otomatis oleh server (WhatsApp Business API)</option><option value="2" ${wm==2?'selected':''}>Buka WhatsApp di perangkat petugas (perlu klik Kirim)</option></select><label for="wt">Isi pesan (placeholder: {nama} {nomor} {layanan} {link} {id} {sandi})</label><textarea id="wt" rows="7">${esc(z.waTpl||WA_DEF)}</textarea><p class="hs">Mode otomatis oleh server membutuhkan Firebase Functions dan akun WhatsApp Business API (lihat functions/index.js). Mode buka WhatsApp di perangkat membuka aplikasi WhatsApp dengan pesan terisi, petugas menekan Kirim. Mode manual tidak memerlukan persiapan tambahan.</p><button class="btn" onclick="simpanZoom()">Simpan pengaturan Zoom</button></div>`};
const _tSet=tSet;tSet=function(){return _tSet().replace('<div class="card"><h2>Layanan warga</h2>',zoomSetCard()+'<div class="card"><h2>Layanan warga</h2>')};
const zoomWarga=()=>{const z=zm();return z.on?`<div class="zm"><div><b>Layanan BPJS lewat Zoom</b><small>${z.id?'Meeting ID '+esc(z.id):''}${z.pw?' · Kode sandi '+esc(z.pw):''}</small></div><a class="btn sm" href="${esc(z.url)}" target="_blank" rel="noopener">Gabung Zoom</a></div>`:''};
const _vHome=vHome;vHome=function(){return _vHome().replace('<div class="qa">',zoomWarga()+'<div class="qa">')};
const _vAnt=vAnt;vAnt=function(){const h=_vAnt();return h.includes('class="tiket"')?h.replace('<p class="msg">Simpan',zoomWarga()+'<p class="msg">Simpan'):h};

/* ===== v1.4: WhatsApp, kiosk, cetak rapi ===== */
const WA_DEF="Halo {nama}, nomor antrian {nomor} sudah dipanggil untuk layanan BPJS ({layanan}).\n\nSilakan gabung Zoom sekarang:\n{link}\nMeeting ID: {id}\nKode sandi: {sandi}\n\nPuskesos Desa Cikulak Kidul";
function waPesan(x){const z=zm();if(!z.on)return`Halo ${x.nama}, nomor antrian ${pad(x.nomor)} sudah dipanggil. Silakan menuju loket pelayanan BPJS, Puskesos Desa Cikulak Kidul.`;
const v={nama:x.nama,nomor:pad(x.nomor),layanan:x.layanan||'',link:z.url,id:z.id,sandi:z.pw};
return String(PS.waTpl||WA_DEF).replace(/\{(nama|nomor|layanan|link|id|sandi)\}/g,(m,k)=>v[k]).replace(/^(Meeting ID|Kode sandi):[ \t]*$\n?/gmi,'')}
const waMode=()=>PS&&PS.waMode!=null?+PS.waMode:(PS&&PS.waAuto?2:0);
const waNo=h=>{const d=hpNorm(h);return /^8\d{8,}$/.test(d)?'62'+d:d};
function kirimWA(id,auto){const x=D.antrian.find(y=>y.id==id);if(!x)return;const no=waNo(x.hp);if(no.length<10)return toast('Nomor HP '+x.nama+' kosong atau tidak valid');window.open('https://wa.me/'+no+'?text='+encodeURIComponent(waPesan(x)),'_blank','noopener');if(!auto)catat('kirim WA','Pesan panggilan '+pad(x.nomor)+' ke '+x.nama,x.nik||'')}
function panggil(id){const x=D.antrian.find(y=>y.id==id);if(!x)return;const z=zm();save('antrian',{...x,status:'dipanggil',dp:Date.now()});DB.collection('publik').doc('status').set({nomor:x.nomor,tgl:today(),dp:Date.now()},{merge:true}).catch(()=>{});
try{const u=new SpeechSynthesisUtterance(`Nomor antrian ${pad(x.nomor).split('').join(' ')}, atas nama ${x.nama}, ${z.on?'silakan gabung Zoom pelayanan BPJS':'silakan menuju loket pelayanan BPJS'}`);u.lang='id-ID';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
if(waMode()==2){kirimWA(id,true);catat('kirim WA','Pesan panggilan '+pad(x.nomor)+' ke '+x.nama,x.nik||'')}}
const _tAnt2=tAnt;tAnt=function(){return _tAnt2().replace(/<button class="btn sm alt" onclick="ubahAnt\('([^']+)'\)">Ubah<\/button>/g,(m,id)=>`<button class="btn sm gold" onclick="kirimWA('${id}')" title="Kirim pesan WhatsApp ke warga">WA</button>`+m)};

function vKiosk(){const c=PS&&PS.tgl==today()?PS:null,st=aqState(),u=location.href.split('#')[0]+'#antrian';
return`<div class="tv"><div class="tvh"><div class="logo"><img src="${LOGO}" alt=""></div><div><b>E PUSKESOS</b><small>Desa Cikulak Kidul, Kec. Waled, Kab. Cirebon</small></div><div class="tvc" id="tvc"></div></div><div class="tvw ksw"><div class="tvz ksq"><small>AMBIL NOMOR ANTRIAN</small><div class="tvq" data-qr="${esc(u)}" data-s="300"></div><p>Pindai dengan kamera HP, lalu isi data singkat</p></div><div class="tvm"><small>NOMOR DIPANGGIL</small><div class="tvn">${c?pad(c.nomor):'—'}</div><p>${st.ok?'Pendaftaran antrian dibuka':esc(st.msg)}</p></div></div><div class="tvf">${PS&&PS.info?esc(PS.info):'Jadwal pelayanan: '+esc(jdw())}</div><div class="tvb noprint"><a href="#beranda">Keluar</a><button onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">Layar penuh</button></div></div>`}

let cdus='',ckw='';
function cetakPr(m){document.body.dataset.pr=m;const f=()=>{delete document.body.dataset.pr;removeEventListener('afterprint',f)};addEventListener('afterprint',f);setTimeout(()=>print(),80)}
function tCetak(){const u=location.href.split('#')[0]+'#antrian',z=zm(),q=ckw.toLowerCase();
const L=D.penerima.filter(x=>(!cdus||(x.dusun||'')==cdus)&&(x.nama+x.nik).toLowerCase().includes(q)).sort((a,b)=>String(a.dusun||'').localeCompare(String(b.dusun||''))||String(a.nama).localeCompare(String(b.nama)));
return`<div class="card noprint"><h2>Cetak dan kiosk</h2><p class="hs">Poster antrian ditempel di loket. Mode kiosk menampilkan barcode antrian besar di tablet atau TV, lengkap dengan nomor yang sedang dipanggil.</p><div class="row"><button class="btn" onclick="cetakPr('poster')">Cetak poster antrian (A4)</button><a class="btn alt" href="#kiosk" target="_blank" rel="noopener">Buka mode kiosk</a></div></div>
<div class="sec-poster pst"><img class="pl" src="${LOGO}" alt=""><h2>ANTRIAN PELAYANAN BPJS</h2><p><b>Puskesos Desa Cikulak Kidul</b><br>Kec. Waled, Kab. Cirebon</p><div data-qr="${esc(u)}" data-s="340"></div><p><b>Pindai dengan kamera HP</b></p><ol><li>Pindai barcode ini.</li><li>Isi nama, NIK, alamat, dan no HP.</li><li>Simpan nomor antrian Anda, tunggu sampai dipanggil.</li></ol><p>Jadwal: <b>${esc(jdw())}</b></p>${z.on?'<div class="zn">Layanan BPJS lewat Zoom. Tautan dikirim ke WhatsApp saat nomor Anda dipanggil.</div>':''}<p style="font-size:13px">Bawa KTP dan KK asli.</p></div>
<div class="sec-kartu"><div class="card noprint"><h2>Kartu barcode pengambilan bansos</h2><div class="row"><div style="flex:1 1 180px"><label for="cd" style="margin-top:0">Dusun</label><select id="cd" onchange="cdus=this.value;render(true)"><option value="">Semua dusun</option>${DUSUN.map(d=>`<option ${d==cdus?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div style="flex:1 1 180px"><label for="cqq" style="margin-top:0">Cari nama atau NIK</label><input id="cqq" value="${esc(ckw)}" onchange="ckw=this.value;render(true)"></div></div><div class="row" style="margin-top:12px"><button class="btn" onclick="cetakPr('kartu')">Cetak ${L.length} kartu</button></div></div>
<div class="kbs">${L.map(x=>`<div class="kb"><img src="${LOGO}" alt=""><b>${esc(x.nama)}</b><small>${esc(x.dusun||'')}${x.alamat?' · '+esc(x.alamat):''}</small><div data-qr="BANSOS:${esc(x.nik)}" data-s="120"></div><small>${esc(x.nik)}</small><small>${esc(x.bansos)} · Desil ${esc(x.desil)}</small></div>`).join('')||'<p class="empty">Tidak ada penerima yang cocok.</p>'}</div></div>`}
render(true);
</script>
<script>
/* ===== PWA: pasang ke layar utama ===== */
(()=>{
const ST=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
let dp=null;const KEY='pk_pwa_x';
const gone=()=>{try{return +localStorage.getItem(KEY)>Date.now()}catch(e){return false}};
const bar=(txt,btn)=>{if(ST()||gone()||!matchMedia('(max-width:900px)').matches)return;let b=document.getElementById('pwa');if(!b){b=document.createElement('div');b.id='pwa';b.innerHTML='<img src="icon-192.png" alt=""><div></div><button class="go" type="button"></button><button class="x" type="button" aria-label="Tutup">✕</button>';document.body.appendChild(b);b.querySelector('.x').onclick=()=>{b.classList.remove('on');try{localStorage.setItem(KEY,String(Date.now()+7*864e5))}catch(e){}}}
b.children[1].innerHTML=txt;const g=b.querySelector('.go');g.textContent=btn;g.style.display=btn?'':'none';g.onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null}b.classList.remove('on')};b.classList.add('on')};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;bar('<b>Pasang E PUSKESOS</b>Buka lebih cepat dari layar utama, seperti aplikasi.','Pasang')});
addEventListener('appinstalled',()=>{const b=document.getElementById('pwa');if(b)b.classList.remove('on')});
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
if(ios&&!ST())setTimeout(()=>bar('<b>Pasang di iPhone</b>Ketuk tombol Bagikan, lalu pilih “Tambah ke Layar Utama”.',''),2500);
})();
</script>
</body></html>
